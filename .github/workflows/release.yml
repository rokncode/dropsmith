# Push a version tag to publish a release with a DMG:
#   git tag v1.0.0 && git push origin v1.0.0
# "Run workflow" on the Actions tab builds the DMG as a downloadable artifact without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Swift 6.2 (`@concurrent`) needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build DMG
        run: make dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Dropsmith-${{ env.VERSION }}
          path: build/Dropsmith-${{ env.VERSION }}.dmg

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Dropsmith-$VERSION.dmg" \
            --title "Dropsmith $VERSION" \
            --generate-notes \
            --notes "Open the DMG and drag Dropsmith to Applications.

          The app isn't notarized yet, so the first launch is blocked. Open **System Settings → Privacy & Security** and click **Open Anyway**, or run:
          \`\`\`
          xattr -dr com.apple.quarantine /Applications/Dropsmith.app
          \`\`\`"
